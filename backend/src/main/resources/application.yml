server:
  port: 8080
  servlet:
    context-path: /api
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: demo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-secret-please-change-32bytes-minimum}
    access-token-ttl: PT30M
  auth:
    refresh-token-ttl: P7D
    refresh-store: ${APP_REFRESH_STORE:memory}
    cookie-secure: ${APP_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
